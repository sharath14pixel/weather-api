<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeroCast — Unit Test Suite</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --pass: #22c55e;
      --fail: #ef4444;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      max-width: 900px;
      margin: 0 auto;
      line-height: 1.5;
    }
    h1 { margin-bottom: 0.5rem; font-size: 1.75rem; }
    p.summary { margin-bottom: 1.5rem; color: var(--muted); }
    .scoreboard {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .score-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.5rem;
      flex: 1;
    }
    .score-num { font-size: 2rem; font-weight: 800; }
    .score-label { color: var(--muted); font-size: 0.85rem; }
    .test-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .test-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .test-name { font-weight: 600; font-size: 0.95rem; }
    .test-badge {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      text-transform: uppercase;
    }
    .test-pass { background: rgba(34, 197, 94, 0.2); color: var(--pass); border: 1px solid var(--pass); }
    .test-fail { background: rgba(239, 68, 68, 0.2); color: var(--fail); border: 1px solid var(--fail); }
    .test-error { font-size: 0.8rem; color: var(--fail); margin-top: 0.25rem; }
  </style>
</head>
<body>
  <h1>AeroCast Unit Test Suite</h1>
  <p class="summary">Automated in-browser unit tests verifying input validation, unit conversions, debounce timing, WMO weather codes, and URL builders without external test frameworks.</p>

  <div class="scoreboard">
    <div class="score-card">
      <div id="total-count" class="score-num">0</div>
      <div class="score-label">Total Tests</div>
    </div>
    <div class="score-card">
      <div id="pass-count" class="score-num" style="color: var(--pass);">0</div>
      <div class="score-label">Passed</div>
    </div>
    <div class="score-card">
      <div id="fail-count" class="score-num" style="color: var(--fail);">0</div>
      <div class="score-label">Failed</div>
    </div>
  </div>

  <div id="test-results" class="test-list" role="region" aria-live="polite"></div>

  <script type="module">
    import { validateCity, celsiusToFahrenheit, kmhToMph, debounce } from './js/utils.js';
    import { getWeatherInterpretation, getSupportedWmoCodes } from './js/weatherCodes.js';
    import {
      calculateActivityIndex,
      calculateUmbrellaAlert,
      calculateClothingRecommendation,
      calculateUvAdvisory,
      calculateSolarProgress,
    } from './js/advisory.js';
    import { CONFIG } from './js/config.js';

    const resultsContainer = document.getElementById('test-results');
    let total = 0;
    let passed = 0;
    let failed = 0;

    function assert(name, condition, errorMsg = '') {
      total++;
      const item = document.createElement('div');
      item.className = 'test-item';

      const left = document.createElement('div');
      const title = document.createElement('div');
      title.className = 'test-name';
      title.textContent = name;
      left.appendChild(title);

      const badge = document.createElement('span');
      badge.className = 'test-badge';

      if (condition) {
        passed++;
        badge.className += ' test-pass';
        badge.textContent = 'PASS';
      } else {
        failed++;
        badge.className += ' test-fail';
        badge.textContent = 'FAIL';
        if (errorMsg) {
          const errP = document.createElement('div');
          errP.className = 'test-error';
          errP.textContent = errorMsg;
          left.appendChild(errP);
        }
      }

      item.appendChild(left);
      item.appendChild(badge);
      resultsContainer.appendChild(item);

      document.getElementById('total-count').textContent = total;
      document.getElementById('pass-count').textContent = passed;
      document.getElementById('fail-count').textContent = failed;
    }

    async function runSuite() {
      // 1. validateCity Tests
      const v1 = validateCity('Paris');
      assert('validateCity: Normal city name accepts', v1.isValid && v1.normalized === 'Paris');

      const v2 = validateCity('   São   Paulo   ');
      assert('validateCity: Trims & collapses spaces for international characters', v2.isValid && v2.normalized === 'São Paulo');

      const v3 = validateCity('Zürich');
      assert('validateCity: Supports umlauts and accented letters', v3.isValid && v3.normalized === 'Zürich');

      const v4 = validateCity('');
      assert('validateCity: Rejects empty string', !v4.isValid);

      const v5 = validateCity('    ');
      assert('validateCity: Rejects whitespace only', !v5.isValid);

      const v6 = validateCity('123456');
      assert('validateCity: Rejects pure numbers', !v6.isValid);

      const v7 = validateCity('!@#$%^&*()');
      assert('validateCity: Rejects pure symbols', !v7.isValid);

      const v8 = validateCity('A'.repeat(81));
      assert('validateCity: Rejects strings exceeding max length (80)', !v8.isValid);

      // 2. Unit Conversion Tests
      assert('celsiusToFahrenheit: 0°C equals 32°F', celsiusToFahrenheit(0) === 32);
      assert('celsiusToFahrenheit: 100°C equals 212°F', celsiusToFahrenheit(100) === 212);
      assert('celsiusToFahrenheit: -40°C equals -40°F', celsiusToFahrenheit(-40) === -40);
      assert('celsiusToFahrenheit: 25°C equals 77°F', celsiusToFahrenheit(25) === 77);

      assert('kmhToMph: 10 km/h converts to ~6.2 mph', Math.abs(kmhToMph(10) - 6.2) < 0.1);
      assert('kmhToMph: 0 km/h equals 0 mph', kmhToMph(0) === 0);

      // 3. WMO Weather Code Coverage
      const codes = getSupportedWmoCodes();
      let allMapped = true;
      let missingCode = null;
      for (const c of codes) {
        const interpDay = getWeatherInterpretation(c, 1);
        const interpNight = getWeatherInterpretation(c, 0);
        if (!interpDay.label || !interpDay.iconKey || !interpDay.themeKey ||
            !interpNight.label || !interpNight.iconKey || !interpNight.themeKey) {
          allMapped = false;
          missingCode = c;
          break;
        }
      }
      assert('WMO Weather Map: All 28 standard codes have complete label, icon, and theme keys', allMapped, `Missing on code: ${missingCode}`);

      // 4. URL Builder
      const testName = 'New York';
      const encoded = encodeURIComponent(testName);
      const testUrl = `${CONFIG.API.GEOCODING_URL}?name=${encoded}&count=1`;
      assert('URL Builder: Properly URI-encodes city queries with spaces', testUrl.includes('name=New%20York'));

      // 5. Debounce Utility
      let debounceCounter = 0;
      const fn = debounce(() => { debounceCounter++; }, 50);
      fn();
      fn();
      fn();
      assert('Debounce: Immediate calls are suppressed', debounceCounter === 0);

      await new Promise(r => setTimeout(r, 80));
      assert('Debounce: Fires exactly once after delay interval', debounceCounter === 1);

      // 6. Smart Advisory Engine Tests
      const actPrime = calculateActivityIndex(20, 10, 50, 0, 0);
      assert('Smart Advisory: Ideal conditions score >= 80%', actPrime.score >= 80 && actPrime.status === 'Prime Conditions');

      const actStorm = calculateActivityIndex(20, 10, 50, 0, 95);
      assert('Smart Advisory: Thunderstorm triggers Avoid Outdoors', actStorm.status === 'Avoid Outdoors');

      const times = ['2026-11-25T14:00', '2026-11-25T15:00', '2026-11-25T16:00'];
      const rainHigh = [10, 85, 20];
      const umbAlert = calculateUmbrellaAlert(times, rainHigh, '2026-11-25T14:00');
      assert('Smart Advisory: Umbrella watch detects peak rain likelihood (85%)', umbAlert.needUmbrella && umbAlert.peakProb === 85);

      const clothingCold = calculateClothingRecommendation(-5, 10);
      assert('Smart Advisory: Sub-zero temperature recommends heavy winter wear', clothingCold.summary === 'Heavy Winter Wear');

      const clothingWarm = calculateClothingRecommendation(24, 8);
      assert('Smart Advisory: 24°C recommends comfortable casual wear', clothingWarm.summary === 'Comfortable Casual');

      const uvHigh = calculateUvAdvisory(6.5);
      assert('Smart Advisory: UV 6.5 classified as High exposure', uvHigh.level === 'High' && uvHigh.uvValue === 6.5);

      const solar = calculateSolarProgress('2026-11-25T06:00', '2026-11-25T18:00', '2026-11-25T12:00');
      assert('Celestial Solar Arc: Solar noon calculates 50% daylight progress', solar.progressPercent === 50 && solar.isDay === true);
    }

    runSuite();
  </script>
</body>
</html>
